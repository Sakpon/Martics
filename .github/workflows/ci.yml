name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Worker type-check
        run: |
          npm install
          npm run type-check

      - name: Web type-check
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Admin type-check
        working-directory: admin
        run: |
          npm install
          npm run build
