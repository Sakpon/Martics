name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Type-check
        run: npm run type-check

      # Apply base schema (idempotent: every statement uses IF NOT EXISTS).
      - name: Apply D1 schema
        run: npx wrangler d1 execute martics_db --remote --file=./src/db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Per-statement additive ALTERs; `|| true` so re-runs don't fail the deploy
      # (carest's daily-migration convention). Add new columns here over time.
      - name: Apply additive migrations
        run: |
          while IFS= read -r stmt; do
            [ -z "$stmt" ] && continue
            npx wrangler d1 execute martics_db --remote --command "$stmt" || true
          done < ./src/db/migrations.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
