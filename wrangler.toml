# Cloudflare Worker config for the Martics bot (mirrors carest's layout).
name = "martics"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

# Every-minute scheduled handler drives broadcasts, digests, rollups, win-back.
[triggers]
crons = ["* * * * *"]

# D1 — primary relational store (SQLite at the edge).
[[d1_databases]]
binding = "DB"
database_name = "martics_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# KV — sessions, short-lived chat context, share tokens, send locks, hot prompt.
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Default Claude model; strong model used selectively by the claude service.
CLAUDE_MODEL = "claude-haiku-4-5-20251001"
CLAUDE_MODEL_STRONG = "claude-sonnet-4-6"
# Public LIFF base (the Astro web Pages project).
WEB_BASE_URL = "https://martics-web.pages.dev"

# Secrets (set via `wrangler secret put`), DO NOT put values here:
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN
#   CLAUDE_API_KEY
#   LIFF_ID
